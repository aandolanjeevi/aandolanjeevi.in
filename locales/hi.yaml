submit:
  heading: लिंक भेजें
  intro: >-
    कोई गाइड, लेख या उपकरण जो यहाँ होना चाहिए? हमें भेजें। हर सुझाव
    प्रकाशित होने से पहले संचालकों द्वारा जाँचा जाता है। इसके लिए किसी खाते
    की ज़रूरत नहीं, और हम आपकी पहचान न माँगते हैं न सहेजते हैं।
  interim: >-
    गुमनाम सबमिशन फ़ॉर्म अभी तैयार किया जा रहा है। तब तक आप GitHub पर इशू
    खोलकर लिंक सुझा सकते हैं।
  cta: GitHub पर लिंक सुझाएँ
  fields:
    url: लिंक (URL)
    title: शीर्षक (वैकल्पिक)
    category: श्रेणी
