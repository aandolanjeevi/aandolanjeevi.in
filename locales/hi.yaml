    choose: "— चुनें —"
  submit: समीक्षा के लिए भेजें
  privacyNote: >-
    यह फ़ॉर्म आपका नाम, ईमेल या IP नहीं लेता। सुझाव समीक्षा क़तार में जाते हैं
    और कभी अपने आप प्रकाशित नहीं होते।
  success:
    heading: धन्यवाद
    body: >-
      आपका सुझाव हमारी समीक्षा क़तार में पहुँच गया है। प्रकाशित होने से पहले
      एक संचालक इसे जाँचेगा।
  error:
    heading: कुछ गड़बड़ हुई
    body: >-
      आपका सुझाव नहीं भेजा जा सका। कृपया फिर से प्रयास करें, या GitHub पर लिंक
      सुझाएँ।
