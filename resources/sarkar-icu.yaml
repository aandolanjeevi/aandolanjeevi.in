title:
  en: "Sarkar on ICU"
  hi: "आईसीयू पर सरकार"
description:
  en: >-
    Sarkar on ICU is a platform that discusses and promotes internet freedom and digital rights in India. It focuses on issues such as privacy, surveillance, freedom of expression, and access to information.
  hi: >-
    सारकर ऑन आईसीयू एक प्लेटफॉर्म है जो भारत में इंटरनेट फ्रीडम और डिजिटल अधिकारों के बारे में चर्चा करता है। वह विषयों पर ध्यान केंद्रित करता है
    जैसे कि गोपनीयता, सुरवेयर, व्यक्तिगत मुक्ति, और सूचना की पहुँच.
