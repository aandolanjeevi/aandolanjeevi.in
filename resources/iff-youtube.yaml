title:
  en: "Internet Freedom Foundation"
  hi: "इंटरनेट फ्रीडम फाउंडेशन"
description:
  en: >-
    Internet Freedom Foundation (IFF) is a non-profit organization that works to
    protect and promote digital rights and freedoms in India. They focus on issues
    such as privacy, surveillance, freedom of expression, and access to information.
  hi: >-
    इंटरनेट फ्रीडम फाउंडेशन (IFF) एक गैर-लाभकारी संगठन है जो भारत में डिजिटल अधिकारों और स्वतंत्रता की सुरक्षा और प्रचार करता है। वे विषयों पर ध्यान केंद्रित करते हैं
    जैसे कि गोपनीयता, सुरवेयर, व्यक्तिगत मुक्ति, और सूचना की पहुँच.
