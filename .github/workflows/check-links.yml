name: Check links (dead-link failover)

# Flips a resource's status to dead when its link is unambiguously gone (so the
# site serves the archived copy), and back to live if it recovers. Conservative
# by design — see scripts/check-links.js. PLAN.md M9.
on:
  schedule:
    - cron: "41 4 * * 3" # Wednesdays 04:41 UTC
  workflow_dispatch:

# Direct pushes to main are blocked; status changes go through an auto-merged PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Check links
        run: node scripts/check-links.js
      - name: Open and auto-merge PR for status changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain resources)" ]]; then
            echo "No status changes."; exit 0
          fi
          branch="bot/link-status-${GITHUB_RUN_ID}"
          git config user.name "aandolanjeevi-bot"
          git config user.email "bot@aandolanjeevi.in"
          git checkout -b "$branch"
          git add resources
          git commit -m "chore: update link status"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: update link status" \
            --body "Automated dead-link failover status changes. Auto-merged."
          for i in 1 2 3 4 5; do
            gh pr merge "$branch" --squash --delete-branch && break
            sleep 5
          done
