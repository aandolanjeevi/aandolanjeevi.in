name: Archive links (Wayback)

# Snapshots every resource link to the Internet Archive and writes the Wayback
# URL back into its entry. Runs when new/changed entries land, weekly to retry
# rate-limited saves, and on demand. See PLAN.md M7.
on:
  push:
    branches: [main]
    paths: ["resources/**"]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

# Direct pushes to main are blocked by branch protection, so the write-back
# opens a PR and auto-merges it. GITHUB_TOKEN actions do not retrigger
# workflows, so this cannot loop. Cloudflare Pages rebuilds on merge (intended).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: archive-wayback
  cancel-in-progress: false

jobs:
  wayback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Save snapshots
        run: node scripts/archive-wayback.js
        env:
          # Optional archive.org S3 key; raises Save Page Now limits when set.
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      - name: Open and auto-merge PR for snapshot URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain resources)" ]]; then
            echo "No new snapshots to record."; exit 0
          fi
          branch="bot/wayback-${GITHUB_RUN_ID}"
          git config user.name "aandolanjeevi-bot"
          git config user.email "bot@aandolanjeevi.in"
          git checkout -b "$branch"
          git add resources
          git commit -m "chore: record wayback snapshots"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: record wayback snapshots" \
            --body "Automated Wayback snapshot URLs. Auto-merged."
          # 0 approvals required; retry to absorb mergeability lag.
          for i in 1 2 3 4 5; do
            gh pr merge "$branch" --squash --delete-branch && break
            sleep 5
          done
